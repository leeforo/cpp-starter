name: CI

# 只在 GitHub 上生效。推到 Gitee 不会触发（Gitee 用的是 Gitee Go，不兼容此语法）。
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux / ${{ matrix.cxx }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          cmake --version
          ${{ matrix.cxx }} --version | head -n 1

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-release:
    name: Linux / Release + 警告视为错误
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Werror"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    name: Windows / MSVC
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 刻意不写 -G：让 CMake 自己挑镜像上最新的 Visual Studio 生成器。
      # 原先写死 "Visual Studio 17 2022" 会让 Configure 直接失败（exit 1），
      # 因为 windows-latest 镜像里的 VS 版本会随镜像更新而变化。
      # 下面这一步把实际可用的生成器打进日志，方便日后排查。
      - name: Toolchain info
        run: |
          cmake --version
          cmake --help | Select-String -Pattern 'Visual Studio'

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
